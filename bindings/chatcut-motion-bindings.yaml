version: 0.2
status: local_library

library:
  repository: jupiwulong98-ship-it/jianjipro
  root: motion-library
  cards: motion-library/cards
  taxonomy: motion-library/taxonomy/card-capabilities.yaml
  router_policy: motion-library/taxonomy/router-policy.yaml

resolution_flow:
  - "Edit Planner输出motion_request"
  - "Motion Router读取families + card-capabilities"
  - "hard filter过滤不兼容卡片"
  - "按router-policy评分"
  - "选择card_id + version"
  - "填充props与media_bindings"
  - "交给ChatCut执行"

legacy_spec_hints:
  giant-keyword:
    request: {family: emphasis, subtype: keyword}
  number-emphasis:
    request: {family: number, subtype: single-metric}
  section-title:
    request: {family: section, subtype: chapter-title}
  accumulating-side-tags:
    request: {family: list, subtype: key-points}
  process-diagram:
    request: {family: process, subtype: process-map}
  grid-stage-screen:
    request: {family: screen-demo, subtype: tool-demo}
  screen-primary-circle-pip:
    request: {family: screen-demo, subtype: screen-pip}
  comparison:
    request: {family: comparison, subtype: metric-compare}

note: "此文件只保留抽象spec到taxonomy的兼容映射；不再把Planner直接绑定到某张卡。"
