version: 0.1

hard_filters:
  - "family必须匹配motion_request.family"
  - "subtype优先精确匹配；无精确候选时才允许同family降级"
  - "item_count必须在卡片支持范围内"
  - "required media slots必须可由Asset Workspace满足"
  - "明确禁止的presenter布局不得选择"

scoring:
  semantic_fit: 0.30
  item_count_fit: 0.20
  media_readiness: 0.15
  presenter_layout_fit: 0.10
  style_skin_fit: 0.10
  density_fit: 0.05
  energy_fit: 0.05
  repetition_penalty: -0.15
  recently_used_same_card_penalty: -0.20

selection:
  candidate_limit: 5
  min_score: 0.55
  if_no_candidate:
    - "尝试同family的fallback subtype"
    - "尝试参数化/升级候选卡"
    - "返回generated_motion_request"
  never:
    - "因为card名字相似就直接选中"
    - "为了命中现有卡而扭曲语义关系"
    - "忽略缺失的required media"

examples:
  - input:
      family: list
      subtype: key-points
      item_count: 3
      presenter: center
    preferred_candidates: [tag-list]
    rejected_examples:
      side-tag-cluster: "v1固定5项"
      process-map-scene: "这是流程，不是并列关系"

  - input:
      family: process
      subtype: process-map
      item_count: 7
    result: generated_or_upgrade
    reason: "process-map-scene v1固定5节点，需v2或动态生成"
