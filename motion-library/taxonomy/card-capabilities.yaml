version: 0.1
cards:
  - id: broll-takeover
    version: 2.0.0
    family: evidence
    subtype: broll
    status: ready
    item_count: {min: 1, max: 1}
    media: {required: [presenterVideo], optional: [brollImage,brollVideo]}
    presenter: {compatible: true, layout: circle_bottom_left}
    visual: {density: low, energy: medium}
    semantic_fit: [example, visual_proof, generated_result]

  - id: category-card-scene
    version: 1.0.0
    family: list
    subtype: category-overview
    status: upgrade_recommended
    item_count: {min: 5, max: 5}
    text: {max_chars_per_item_cn: 6}
    media: {required: [presenterVideo]}
    presenter: {compatible: true, layout: center_rounded_rect}
    visual: {density: high, energy: medium, skin: dark_grid}
    semantic_fit: [category_menu, content_map]
    limitations: ["固定5项"]

  - id: chapter-neon-title
    version: 1.0.0
    family: section
    subtype: chapter-title
    status: ready
    item_count: {min: 1, max: 1}
    media: {optional: [backgroundImage,backgroundVideo]}
    presenter: {compatible: false}
    visual: {density: medium, energy: high, skin: neon_tech}
    semantic_fit: [section, category_change, case_change]

  - id: keyword-impact
    version: 2.0.0
    family: emphasis
    subtype: keyword
    status: ready
    item_count: {min: 1, max: 1}
    text: {max_chars_cn: 8}
    media: {required: []}
    presenter: {compatible: true, layout: behind_presenter}
    visual: {density: low, energy: high}
    semantic_fit: [hook, punchline, key_term, short_claim]

  - id: logo-wall
    version: 2.0.0
    family: entity
    subtype: logo-wall
    status: upgrade_recommended
    item_count: {min: 8, max: 8}
    media: {required: [logo1,logo2,logo3,logo4,logo5,logo6,logo7,logo8]}
    presenter: {compatible: true, layout: foreground}
    visual: {density: high, energy: medium}
    semantic_fit: [many_tools, ecosystem]
    limitations: ["固定8个Logo"]

  - id: number-impact
    version: 2.0.0
    family: number
    subtype: single-metric
    status: ready
    item_count: {min: 1, max: 1}
    media: {required: []}
    presenter: {compatible: true, positions: [left,right,center]}
    visual: {density: low, energy: high}
    semantic_fit: [number, money, percentage, count]

  - id: perspective-result-split
    version: 1.0.0
    family: evidence
    subtype: perspective-result
    status: ready
    item_count: {min: 1, max: 1}
    media: {required: [presenterVideo], optional: [resultImage,resultVideo]}
    presenter: {compatible: true, layout: left_large}
    visual: {density: medium, energy: medium, skin: dark_grid}
    semantic_fit: [result, example, visual_proof]

  - id: process-map-scene
    version: 1.0.0
    family: process
    subtype: process-map
    status: upgrade_recommended
    item_count: {min: 5, max: 5}
    text: {max_chars_per_item_cn: 6}
    media: {required: []}
    presenter: {compatible: false}
    visual: {density: high, energy: medium, skin: dark_grid}
    semantic_fit: [workflow, steps, pipeline]
    limitations: ["固定5节点","固定十字布局"]

  - id: proof-split-scene
    version: 1.0.0
    family: evidence
    subtype: proof
    status: ready
    item_count: {min: 1, max: 1}
    media: {required: [presenterVideo,proofImage], optional: [logoImage]}
    presenter: {compatible: true, layout: left}
    visual: {density: medium, energy: medium, skin: dark_grid}
    semantic_fit: [screenshot_evidence, document_evidence, quote_evidence]

  - id: result-card-scene
    version: 1.0.0
    family: evidence
    subtype: single-result
    status: ready
    item_count: {min: 1, max: 1}
    media: {required: [presenterVideo], optional: [resultImage,resultVideo]}
    presenter: {compatible: true, layout: circle_bottom_left}
    visual: {density: low, energy: medium, skin: dark_grid}
    semantic_fit: [single_result, one_screenshot]

  - id: result-compare
    version: 1.0.0
    family: comparison
