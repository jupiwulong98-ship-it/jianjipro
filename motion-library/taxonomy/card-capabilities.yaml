    status: partially_ready
    item_count: {min: 0, max: 3}
    media: {required: [screenVideo,logoImage,presenterVideo]}
    presenter: {compatible: true, layout: circle_bottom_left}
    visual: {density: medium, energy: medium, skin: dark_grid}
    semantic_fit: [tutorial_step, interface_demo]
    limitations: ["强制Logo","固定3个卖点槽位"]

  - id: side-kicker
    version: 1.0.0
    family: list
    subtype: side-list
    status: ready
    item_count: {min: 1, max: 3}
    text: {max_chars_per_item_cn: 8}
    media: {required: []}
    presenter: {compatible: true, layout: side}
    visual: {density: low, energy: medium}
    semantic_fit: [compact_parallel_terms, feature_list]

  - id: side-tag-cluster
    version: 1.0.0
    family: list
    subtype: key-points
    status: upgrade_recommended
    item_count: {min: 5, max: 5}
    text: {max_chars_per_item_cn: 6}
    media: {required: []}
    presenter: {compatible: true, layout: around_presenter}
    visual: {density: high, energy: medium}
    semantic_fit: [parallel_points, features, pain_points]
    limitations: ["固定5项","固定左右位置"]

  - id: tag-list
    version: 1.0.0
    family: list
    subtype: key-points
    status: ready
    item_count: {min: 2, max: 6}
    text: {input_format: "pipe-delimited", max_chars_per_item_cn: 8}
    media: {required: []}
    presenter: {compatible: true}
    visual: {density: medium, energy: medium}
    semantic_fit: [parallel_points, features, options]

  - id: template-wall
    version: 2.0.0
