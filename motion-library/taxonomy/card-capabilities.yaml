    status: ready
    item_count: {min: 2, max: 2}
    media: {required: [images]}
    presenter: {compatible: false}
    visual: {density: medium, energy: medium}
    semantic_fit: [before_after_media, result_comparison]

  - id: result-gallery-scene
    version: 1.0.0
    family: evidence
    subtype: gallery
    status: ready
    item_count: {min: 2, max: 4}
    media: {required: [image1,image2,presenterVideo], optional: [image3,image4]}
    presenter: {compatible: true, layout: circle_bottom_left}
    visual: {density: high, energy: medium, skin: dark_grid}
