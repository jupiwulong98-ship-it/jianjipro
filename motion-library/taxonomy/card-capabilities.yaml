  - id: tool-demo-scene
    version: 1.0.0
    family: screen-demo
    subtype: tool-demo
    status: partially_ready
    item_count: {min: 0, max: 3}
    media: {required: [screenVideo,logoImage,presenterVideo]}
    presenter: {compatible: true, layout: circle_bottom_left}
    visual: {density: high, energy: medium, skin: dark_grid}
    semantic_fit: [tool_demo_with_features, tutorial_step]
    limitations: ["固定3个卖点槽位","强制Logo"]
