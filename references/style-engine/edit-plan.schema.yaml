version: 0.4
project_id: string
style_id: string
source_video: string
semantic_segments: []
visual_concepts_source: string

events:
  - id: edit-event-id
    start: 0.0
    end: 0.0
    source_segment_id: segment-id
    visual_concept_id: visual-event-id
    intent: emphasis|explain|compare|show_entity|show_number|pace_change|transition|evidence|none
    rationale: ""
    style_rule_id: ""

    motion_request:
      required: true
      family: emphasis|number|section|list|process|comparison|evidence|screen-demo|entity|statement|checklist|equation|quote
      subtype: string
      visual_structure: string
      content:
        text: null
        items: []
        metrics: []
        labels: []
      constraints:
        item_count: null
        max_chars_per_item: null
        presenter_position: null
        input_types_required: []
        input_types_optional: []
        media_available: []
        media_required: []
      visual_intent:
        energy: low|medium|high
        density: low|medium|high
        preferred_layouts: []
        preferred_skin: null
      avoid: []

    presentation_hint:
      preferred_mode: presenter_safe|full_screen|auto
      presenter_required: false

    supporting_layer_hints:
      annotation: none|optional|recommended
      camera: none|optional|recommended
      transition: none|optional|recommended
      sfx: none|optional|recommended

    asset_requirements: []

    resolution:
      status: unresolved|resolved|generated|fallback|skipped
      card_id: null
      card_version: null
      score: null
      reason: ""
      props: {}
      media_bindings: {}

    fallback: {}
    qc_checks: []

rules:
  - "Planner只填写motion_request与presentation/supporting hints，不直接指定card_id。"
  - "具体安全区、运镜、标注、转场在Shotbook Planner落实。"
  - "resolution由Motion Router填写。"
  - "若motion_request.required=false，可保持干净口播。"
  - "motion_request必须由先前画面概念推导，visual_structure保持一致。"
